# Lints and formats the Hermes Python adapter and its test. Hermes needs Python 3.11+.
target-version = "py311"
# The adapter already wraps at 120 columns, like the TypeScript sources.
line-length = 120

[lint]
# Ruff's classic default set (pycodestyle errors + Pyflakes), pinned because newer releases widen the default.
select = ["E4", "E7", "E9", "F"]

[format]
# Ruff also formats Markdown code blocks; keep the format check to the Python sources.
exclude = ["*.md"]
